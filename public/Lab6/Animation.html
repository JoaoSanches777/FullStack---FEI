<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animação</title>
    <link rel="stylesheet" href="Animation.css">
</head>

<body>
    <div class="conteudo">
        <h1>Animação</h1>
        <canvas id="meuCanvas" width="300" height="300"></canvas>
        <a href="../Aula2/projects.html">Voltar para Projetos</a>
    </div>

    <script>
        let canvas = document.getElementById("meuCanvas");
        let ctx = canvas.getContext("2d");

        let imagem = new Image();
        imagem.src = "imagem.jpg";

        let largura = 50;
        let altura = 50;

        // Posicao inicial: centro do canvas
        let x = (canvas.width - largura) / 2;
        let y = (canvas.height - altura) / 2;

        function desenhar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(imagem, x, y, largura, altura);
        }

        function mover(evento) {
            let borda = canvas.getBoundingClientRect();

            // Posicao do mouse dentro do canvas, com o ponteiro no centro da imagem
            x = evento.clientX - borda.left - largura / 2;
            y = evento.clientY - borda.top - altura / 2;

            // A imagem nunca sai do canvas
            if (x < 0) {
                x = 0;
            }
            if (x > canvas.width - largura) {
                x = canvas.width - largura;
            }
            if (y < 0) {
                y = 0;
            }
            if (y > canvas.height - altura) {
                y = canvas.height - altura;
            }

            desenhar();
        }

        imagem.onload = desenhar;
        document.onmousemove = mover;
    </script>
</body>

</html>
