<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhação</title>
    <link rel="stylesheet" href="guess.css">
</head>

<body>
    <div class="caixa" id="caixa">
        <h1>Adivinhação</h1>
        <p>Digite um número de 0 a 99</p>
        <input type="text" id="numero">
        <input type="button" value="Chutar" onclick="adivinhar();">
        <p id="resultado"></p>
        <a href="../Aula2/projects.html">Voltar para Projetos</a>
    </div>

    <script>
        let sorteado = Math.floor(Math.random() * 100);

        function adivinhar() {
            let chute = parseInt(document.getElementById("numero").value);

            if (chute > sorteado) {
                document.getElementById("resultado").innerHTML = "Errou! O número é menor que " + chute;
                document.getElementById("caixa").style.setProperty("background-color", "red");
            } else if (chute < sorteado) {
                document.getElementById("resultado").innerHTML = "Errou! O número é maior que " + chute;
                document.getElementById("caixa").style.setProperty("background-color", "red");
            } else if (chute === sorteado) {
                document.getElementById("resultado").innerHTML = "Acertou! O número era " + sorteado;
                document.getElementById("caixa").style.setProperty("background-color", "green");
            }
        }
    </script>
</body>

</html>
